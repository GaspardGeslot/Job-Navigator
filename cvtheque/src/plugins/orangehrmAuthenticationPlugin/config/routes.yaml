##########################
#   Subdomain Routes (sans theme dans l'URL)
##########################

subdomain_root:
  path: /
  controller: OrangeHRM\Authentication\Controller\RootController::handle
  methods: [ GET ]

subdomain_auth_login:
  path: /auth/login
  controller: OrangeHRM\Authentication\Controller\LoginController::handle
  methods: [ GET ]

subdomain_auth_login_admin:
  path: /auth/admin/login
  controller: OrangeHRM\Authentication\Controller\LoginAdminController::handle
  methods: [ GET ]

subdomain_auth_login_company:
  path: /auth/company/login
  controller: OrangeHRM\Authentication\Controller\LoginCompanyController::handle
  methods: [ GET ]

subdomain_auth_create_account:
  path: /auth/createAccount
  controller: OrangeHRM\Authentication\Controller\CreateAccountController::handle
  methods: [ GET ]

subdomain_auth_validate:
  path: /auth/validate
  controller: OrangeHRM\Authentication\Controller\ValidateController::handle
  methods: [ POST ]

subdomain_auth_validate_with_role:
  path: /auth/validate/{role}
  controller: OrangeHRM\Authentication\Controller\ValidateController::handle
  methods: [ POST ]
  requirements:
    role: admin|candidate|maraudes

subdomain_auth_company_validate:
  path: /auth/company/validate
  controller: OrangeHRM\Authentication\Controller\ValidateCompanyController::handle
  methods: [ POST ]

subdomain_auth_validate_new_account:
  path: /auth/validateNewAccount
  controller: OrangeHRM\Authentication\Controller\ValidateNewAccountController::handle
  methods: [ POST ]

subdomain_auth_validate_new_account_with_role:
  path: /auth/validateNewAccount/{role}
  controller: OrangeHRM\Authentication\Controller\ValidateNewAccountController::handle
  methods: [ POST ]
  requirements:
    role: admin|candidate|maraudes

subdomain_auth_validate_olecio:
  path: /auth/validateOlecio
  controller: OrangeHRM\Authentication\Controller\ValidateOlecioController::handle
  methods: [ POST ]

subdomain_auth_olecio_callback:
  path: /auth/olecio/callback
  controller: OrangeHRM\Authentication\Controller\OlecioAuthCallbackController::handle
  methods: [ GET ]

subdomain_auth_logout:
  path: /auth/logout
  controller: OrangeHRM\Authentication\Controller\LogoutController::handle
  methods: [ GET ]

subdomain_auth_admin_access_verify:
  path: /auth/adminVerify
  controller: OrangeHRM\Authentication\Controller\AdministratorVerifyController::handle
  methods: [ POST ]

subdomain_auth_request_reset_password:
  path: /auth/requestResetPassword
  controller: OrangeHRM\Authentication\Controller\RequestResetPasswordController::handle
  methods: [ POST ]

subdomain_auth_reset_password:
  path: /auth/resetPassword
  controller: OrangeHRM\Authentication\Controller\ResetPasswordController::handle
  methods: [ POST ]

subdomain_auth_send_password_reset:
  path: /auth/sendPasswordReset
  controller: OrangeHRM\Authentication\Controller\RequestPasswordSuccessController::handle
  methods: [ GET ]

subdomain_auth_forgot_password_username:
  path: /auth/requestPasswordResetCode
  controller: OrangeHRM\Authentication\Controller\RequestPasswordController::handle
  methods: [ GET ]

subdomain_auth_reset_code:
  path: /auth/resetPassword/resetCode/{resetCode}
  controller: OrangeHRM\Authentication\Controller\ResetCodeController::handle
  methods: [ GET ]

subdomain_auth_weak_password_reset:
  path: /auth/changeWeakPassword/resetCode/{resetCode}
  controller: OrangeHRM\Authentication\Controller\WeakPasswordResetController::handle
  methods: [ GET ]

subdomain_auth_request_enforce_password:
  path: /auth/resetWeakPassword
  controller: OrangeHRM\Authentication\Controller\RequestResetWeakPasswordController::handle
  methods: [ POST ]

subdomain_apiv2_auth_public_validation_password:
  path: /api/v2/auth/public/validation/password
  controller: OrangeHRM\Core\Controller\Rest\V2\GenericPublicRestController::handle
  methods: [ POST ]
  defaults:
    _api: OrangeHRM\Authentication\PublicApi\PasswordStrengthValidationAPI

##########################
#  Fallback Routes (avec theme dans l'URL)
##########################

apiv2_auth_public_validation_password:
  path: /{theme}/api/v2/auth/public/validation/password
  controller: OrangeHRM\Core\Controller\Rest\V2\GenericPublicRestController::handle
  methods: [ POST ]
  defaults:
    _api: OrangeHRM\Authentication\PublicApi\PasswordStrengthValidationAPI

